services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Use a persistent Docker volume instead of a host file mount
    volumes:
      - voting_data:/app
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

volumes:
  voting_data:
